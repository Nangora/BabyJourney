spring.application.name=SpringBootDemo

# ---- Database ----
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=babyjourney;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:Vbooking@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate chỉ kiểm tra Entity khớp bảng SQL Server, không tự tạo/sửa bảng (Flyway đảm nhiệm)
spring.jpa.hibernate.ddl-auto=validate
debug=true

# ---- JWT ----
# Khóa bí mật ký token, phải giữ kín. Khi lên production chuyển sang biến môi trường.
app.jwt.secret=${JWT_SECRET:babyjourney-super-secret-key-doi-it-nhat-32-ky-tu-cho-an-toan}
# Token hết hạn sau 24 giờ (mili giây)
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

# ---- Google login ----
# Authorized JavaScript origins trên Google Cloud: http://localhost:4200
app.google.client-id=${GOOGLE_CLIENT_ID:857757617806-8v3ho2i8hp0mn362v5ea6coiuf6hjsio.apps.googleusercontent.com}

# ---- Quên mật khẩu ----
app.frontend-url=http://localhost:4200
app.password-reset.expiration-minutes=30
app.mail.from=${MAIL_USERNAME:no-reply@babyjourney.local}

# Chưa đặt MAIL_USERNAME / MAIL_PASSWORD thì vẫn chạy được:
# link đặt lại mật khẩu sẽ in ra console backend (dòng có chữ [DEV]).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true