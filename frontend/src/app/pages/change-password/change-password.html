<div class="auth-page">
  <div class="auth-card">
    <h1>Thay đổi mật khẩu</h1>

    @if (successMessage()) {
      <div class="form-notice">{{ successMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Mật khẩu hiện tại</span>
        <input type="password" formControlName="currentPassword" />
        @if (form.controls.currentPassword.invalid && form.controls.currentPassword.touched) {
          <span class="field-error">Vui lòng nhập mật khẩu hiện tại</span>
        }
      </label>

      <label>
        <span>Mật khẩu mới</span>
        <input type="password" formControlName="newPassword" />
        @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
          <span class="field-error">{{ passwordHint }}</span>
        }
      </label>

      <label>
        <span>Nhập lại mật khẩu mới</span>
        <input type="password" formControlName="confirmPassword" />
        @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')) {
          <span class="field-error">Vui lòng nhập lại mật khẩu mới</span>
        } @else if (form.controls.confirmPassword.touched && form.hasError('mismatch')) {
          <span class="field-error">Mật khẩu xác nhận không khớp</span>
        }
      </label>

      @if (errorMessage()) {
        <div class="form-error">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Đang cập nhật...' : 'Đổi mật khẩu' }}
      </button>
    </form>
  </div>
</div>
