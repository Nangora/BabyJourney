<app-auth-layout>
  <div class="auth-card">
    <h1>Quên mật khẩu?</h1>
    <p class="subtitle">Nhập email tài khoản, chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.</p>

    @if (successMessage()) {
      <div class="form-notice">{{ successMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        Email
        <input type="email" formControlName="email" placeholder="ban@email.com" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">Vui lòng nhập email hợp lệ</span>
        }
      </label>

      @if (errorMessage()) {
        <div class="form-error">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Đang gửi...' : 'Gửi yêu cầu' }}
      </button>
    </form>

    <p class="auth-switch"><a routerLink="/login">← Quay lại đăng nhập</a></p>
  </div>
</app-auth-layout>
