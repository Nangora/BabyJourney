<app-auth-layout>
  <div class="auth-card">
    <h1>Đặt lại mật khẩu</h1>

    @if (!token) {
      <div class="form-error">Liên kết không hợp lệ.</div>
      <p class="auth-switch"><a routerLink="/forgot-password">Yêu cầu liên kết mới</a></p>
    } @else {
      <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label>
          Mật khẩu mới
          <input type="password" formControlName="newPassword" placeholder="Tạo mật khẩu mới" />
          @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
            <span class="field-error">{{ passwordHint }}</span>
          }
        </label>

        <label>
          Nhập lại mật khẩu mới
          <input type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu" />
          @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')) {
            <span class="field-error">Vui lòng nhập lại mật khẩu</span>
          } @else if (form.controls.confirmPassword.touched && form.hasError('mismatch')) {
            <span class="field-error">Mật khẩu xác nhận không khớp</span>
          }
        </label>

        @if (errorMessage()) {
          <div class="form-error">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Đang cập nhật...' : 'Đặt lại mật khẩu' }}
        </button>
      </form>

      <p class="auth-switch"><a routerLink="/forgot-password">Yêu cầu liên kết mới</a></p>
    }
  </div>
</app-auth-layout>
